name: Build
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Projekt entpacken
        run: |
          for f in *; do
            if [ -f "$f" ] && tar tzf "$f" >/dev/null 2>&1; then
              tar xzf "$f"
            fi
          done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle assembleDebug --no-daemon
      - run: cp app/build/outputs/apk/debug/app-debug.apk LanRelay.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LanRelay
          path: LanRelay.apk
      - name: Release veröffentlichen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "v${{ github.run_number }}" LanRelay.apk --title "LAN Relay v${{ github.run_number }}" --notes "Android-App ohne Werbung" --latest
